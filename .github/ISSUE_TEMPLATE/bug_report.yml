name: Bug report / Impasto imprevisto
description: A reproducible software bug. Dough photos are welcome; exact inputs are better.
title: "[Bug] "
labels: []
body:
  - type: textarea
    id: problem
    attributes:
      label: Expected and actual result
      description: English or Italian. Explain what happened and what you expected.
    validations:
      required: true
  - type: textarea
    id: recipe
    attributes:
      label: Minimal recipe and steps to reproduce
      description: Method, quantities, hydration, temperatures, durations, fridge/autolyse, anchor type and machine. Use fictitious dates if personal.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Browser, operating system and commit/version
      placeholder: Firefox / Linux / commit abc1234
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Screenshots or relevant errors
      description: Remove personal data. Do not report security exploits here; see SECURITY.md.
